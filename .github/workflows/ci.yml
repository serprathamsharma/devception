name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-check:
    name: Client Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devception-client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './devception-client/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Sitemap validation check
        run: npm run check:sitemap

  server-check:
    name: Server Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devception-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './devception-server/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build verification
        run: npm run build
